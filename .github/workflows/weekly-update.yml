name: PCFL Build & Deploy (production + staging)

# One Pages deployment carries both environments:
#   production  <- main branch     -> https://pcfl2k.github.io/PCFL-Football/
#   staging     <- staging branch  -> https://pcfl2k.github.io/PCFL-Football/staging/
# Iterate on `staging`, verify at /staging/, then merge staging -> main to promote.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod

      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          path: staging

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh PCFL Network video feed
        continue-on-error: true
        run: |
          curl -sf "https://www.youtube.com/feeds/videos.xml?channel_id=UCCopjecFoHzlVp99e-3W2yA" -o feed.xml
          if [ -s feed.xml ]; then
            cp feed.xml prod/scripts/yt-feed.xml
            cp feed.xml staging/scripts/yt-feed.xml
          fi

      - name: Parse FBPro98 exports (production)
        timeout-minutes: 240
        run: node prod/scripts/parse-fbpro.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PCFL_AI_URL: ${{ secrets.PCFL_AI_URL }}
          PCFL_AI_TOKEN: ${{ secrets.PCFL_AI_TOKEN }}
          # new AI recaps (free VPS Ollama, ~1-3 min each) are generated only for the live site
          # repo variable PCFL_AI_MODE=cache-only keeps production builds fast (reuse written content only);
          # set it to 'generate' (or delete it) to let production builds write new AI content again
          PCFL_AI_CACHE_ONLY: ${{ (github.ref != 'refs/heads/main' || vars.PCFL_AI_MODE == 'cache-only') && '1' || '' }}

      - name: Share AI cache with staging (no regeneration of the same prompts)
        run: |
          for d in prod/data/*/ai-cache; do
            season=$(basename "$(dirname "$d")")
            mkdir -p "staging/data/$season/ai-cache"
            cp -n "$d"/*.json "staging/data/$season/ai-cache/" 2>/dev/null || true
          done

      - name: Parse FBPro98 exports (staging)
        run: node staging/scripts/parse-fbpro.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PCFL_AI_URL: ${{ secrets.PCFL_AI_URL }}
          PCFL_AI_TOKEN: ${{ secrets.PCFL_AI_TOKEN }}
          PCFL_AI_CACHE_ONLY: '1'

      - name: Commit regenerated production data
        if: github.ref == 'refs/heads/main'
        working-directory: prod
        run: |
          git config user.name "pcfl-bot"
          git config user.email "actions@github.com"
          git add data scripts/yt-feed.xml
          git diff --cached --quiet || git commit -m "data: regenerate weekly JSON [bot]"
          git push

      - name: Assemble combined site (prod at root, staging under /staging/)
        run: |
          mkdir site
          cp -r prod/. site/
          mkdir -p site/staging
          cp -r staging/. site/staging/
          rm -rf site/.git site/.github site/staging/.git site/staging/.github site/staging/drops
          touch site/.nojekyll

      - name: Stamp build id (cache busting + client freshness check)
        run: |
          STAMP="${GITHUB_SHA::10}-${GITHUB_RUN_NUMBER}"
          for f in site/index.html site/js/*.js site/staging/index.html site/staging/js/*.js; do
            [ -f "$f" ] && sed -i "s/__BUILD__/${STAMP}/g" "$f"
          done
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"build\":\"$STAMP\",\"at\":\"$NOW\"}" > site/version.json
          cp site/version.json site/staging/version.json
          echo "build stamp: $STAMP"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
